name: Java CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/gointerop/keycloak-extensions-for-fhir

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Runs the unit tests plus the Testcontainers/Selenium test against a real Keycloak
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Read Keycloak version
        id: kc
        run: echo "version=$(mvn -q help:evaluate -Dexpression=keycloak.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=${{ steps.kc.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: KEYCLOAK_VERSION=${{ steps.kc.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Fails the build on fixable HIGH/CRITICAL CVEs in the image
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by SHA because tags are mutable
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN: a Docker Hub access token with read/write scope on the gointerop namespace
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push --all-tags ${{ env.IMAGE_NAME }}
