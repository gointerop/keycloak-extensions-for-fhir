name: Java CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/gointerop/keycloak-extensions-for-fhir

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # pom.xml is the single source of truth for the Keycloak version: Dependabot's Maven ecosystem bumps
      # keycloak.version, but it cannot resolve the ARG in the Dockerfile's FROM (the tag regex does not accept
      # ${...}). CI always builds with --build-arg from the pom, so a stale default would only bite local
      # `docker build .` and the IDE test fallback. Fail fast and loudly instead of drifting silently.
      - name: Check Keycloak version defaults match pom.xml
        run: |
          pom="$(sed -n 's|.*<keycloak.version>\(.*\)</keycloak.version>.*|\1|p' pom.xml)"
          docker="$(sed -n 's|^ARG KEYCLOAK_VERSION=\(.*\)$|\1|p' Dockerfile | tr -d '\r')"
          test_default="$(sed -n 's|.*getProperty("keycloak.version", "\([^"]*\)").*|\1|p' keycloak-extensions/src/test/java/org/alvearie/keycloak/KeycloakContainerTest.java)"
          echo "pom=$pom Dockerfile=$docker test=$test_default"
          [ -n "$pom" ] || { echo "::error::keycloak.version not found in pom.xml"; exit 1; }
          [ "$docker" = "$pom" ] || { echo "::error file=Dockerfile::ARG KEYCLOAK_VERSION default ($docker) must equal keycloak.version in pom.xml ($pom)"; exit 1; }
          [ "$test_default" = "$pom" ] || { echo "::error file=keycloak-extensions/src/test/java/org/alvearie/keycloak/KeycloakContainerTest.java::fallback version ($test_default) must equal keycloak.version in pom.xml ($pom)"; exit 1; }

      # Runs the unit tests plus the Testcontainers/Selenium test against a real Keycloak
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Read Keycloak version
        id: kc
        run: echo "version=$(mvn -q help:evaluate -Dexpression=keycloak.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=${{ steps.kc.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: KEYCLOAK_VERSION=${{ steps.kc.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Fails the build on fixable HIGH/CRITICAL CVEs in the image
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by SHA because tags are mutable
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Fixable upstream Keycloak CVEs accepted after review: scoped by `paths`, justified and with an expiry.
          # A single YAML file is passed to Trivy as-is (v0.36.0 entrypoint); plain files would be concatenated.
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN: a Docker Hub access token with read/write scope on the gointerop namespace
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push --all-tags ${{ env.IMAGE_NAME }}
